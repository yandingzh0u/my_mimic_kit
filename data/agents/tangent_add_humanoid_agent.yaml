agent_name: "TangentADD"

# TangentADD (stage 1): ADD + gated fixed tangent reward.
# Everything except the tangent_reward block is copied verbatim from
# add_humanoid_agent.yaml; the ADD discriminator branch is untouched and
# tangent_reward.scale = 0 is numerically identical to ADD.

model:
  actor_net: "fc_2layers_1024units"
  actor_init_output_scale: 0.01
  actor_std_type: "FIXED"
  action_std: 0.05
  
  critic_net: "fc_2layers_1024units"

  disc_net: "fc_2layers_1024units"

actor_optimizer:
    type: "SGD"
    learning_rate: 1e-4
    
critic_optimizer:
    type: "SGD"
    learning_rate: 1e-4

disc_optimizer:
    type: "SGD"
    learning_rate: 2.5e-4
    weight_decay: 0.0001

discount: 0.99
steps_per_iter: 32
iters_per_output: 100
test_episodes: 32
normalizer_samples: 100000000
use_mixed_precision: false

actor_epochs: 5
actor_batch_size: 4
critic_epochs: 2
critic_batch_size: 2
disc_epochs: 2
disc_batch_size: 2

td_lambda: 0.95
ppo_clip_ratio: 0.2
norm_adv_clip: 4.0
action_bound_weight: 10.0
action_entropy_weight: 0.0
action_reg_weight: 0.0

disc_buffer_size: 200000
disc_replay_samples: 1000
disc_logit_reg: 0.01
disc_grad_penalty: 2
disc_reward_scale: 2

task_reward_weight: 0.0
disc_reward_weight: 1.0

# r = r_ADD + scale * w_t * exp(-E_tan / (2 * error_sigma^2)),
# w_t = exp(-E_cfg / (2 * gate_radius^2)); always in [0, scale], non-negative.
# scale (lambda_tan) is the only real hyperparameter, calibrated ONCE and
# frozen: on a fixed batch (roll, seed 0, iters 1-19 x 512 envs x 32 steps)
# pooled std(r_tan) = 0.109 and std(r_ADD) = 0.066, so scale = 0.2 puts
# std(scale * r_tan) at 33% of std(r_ADD), inside the 25%-50% target band.
# Not re-tuned per motion.
# scale_file is frozen output of tools/flow_add/calibrate_tangent_scales.py.
tangent_reward:
  scale: 0.2
  gate_radius: 1.0
  error_sigma: 1.0
  group_weights: [0.333333, 0.333333, 0.333333]
  scale_file: "data/stats/humanoid_tangent_scales.npz"
