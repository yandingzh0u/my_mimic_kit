agent_name: "FlowADD"

model:
  actor_net: "fc_2layers_1024units"
  actor_init_output_scale: 0.01
  actor_std_type: "FIXED"
  action_std: 0.05
  
  critic_net: "fc_2layers_1024units"

  disc_net: "fc_2layers_1024units"
  # discriminator mode, logit z = f(x_t) + q_prog + q_circ with
  #   q_prog = E_S(x_t-1) - E_S(x_t), S = L L^T  (error progress)
  #   q_circ = x_t-1^T A x_t,         A = B - B^T (error circulation)
  #   "flow":        q_prog + q_circ (FlowADD-P+C, full method)
  #   "potential":   q_prog only     (FlowADD-P ablation)
  #   "circulation": q_circ only     (FlowADD-C ablation)
  #   "concat":      plain MLP on [x_t, v_t] (Concat-ADD baseline)
  disc_mode: "flow"
  # init std of L is disc_flow_init_scale / diff_dim, giving initial error energy
  # E_S ~ scale^2 / 2; B always starts at 0, so training starts close to plain ADD
  disc_flow_init_scale: 1.0

# contraction teacher for the potential branch: synthetic transitions
# (x, c x), c ~ U[0, 1) sampled from the negative batch are labeled positive,
# with f detached (only trains L; gradient w.r.t. B is exactly 0). Prevents
# the S matrix from collapsing under the negative-only BCE. 0 disables.
disc_flow_contract_weight: 0.5

actor_optimizer:
    type: "SGD"
    learning_rate: 1e-4
    
critic_optimizer:
    type: "SGD"
    learning_rate: 1e-4

disc_optimizer:
    type: "SGD"
    learning_rate: 2.5e-4
    weight_decay: 0.0001

discount: 0.99
steps_per_iter: 32
iters_per_output: 100
test_episodes: 32
normalizer_samples: 100000000
use_mixed_precision: false

actor_epochs: 5
actor_batch_size: 4
critic_epochs: 2
critic_batch_size: 2
disc_epochs: 2
disc_batch_size: 2

td_lambda: 0.95
ppo_clip_ratio: 0.2
norm_adv_clip: 4.0
action_bound_weight: 10.0
action_entropy_weight: 0.0
action_reg_weight: 0.0

disc_buffer_size: 200000
disc_replay_samples: 1000
disc_logit_reg: 0.01
disc_grad_penalty: 2
disc_reward_scale: 2

task_reward_weight: 0.0
disc_reward_weight: 1.0
