agent_name: "DARE"

model:
  actor_net: "fc_2layers_1024units"
  actor_init_output_scale: 0.01
  actor_std_type: "FIXED"
  action_std: 0.05
  critic_net: "fc_2layers_1024units"
  disc_net: "fc_10layers_1024units"
  disc_group_embedding: true
  disc_hidden_geometry: "full_sn"

actor_optimizer: {type: "SGD", learning_rate: 1e-4}
critic_optimizer: {type: "SGD", learning_rate: 1e-4}
disc_optimizer: {type: "SGD", learning_rate: 2.5e-4, weight_decay: 0.0001}

discount: 0.99
steps_per_iter: 32
iters_per_output: 1
test_episodes: 4
normalizer_samples: 2097152
use_mixed_precision: false
actor_epochs: 1
actor_batch_size: 4
critic_epochs: 1
critic_batch_size: 2
disc_epochs: 1
disc_batch_size: 2
td_lambda: 0.95
ppo_clip_ratio: 0.2
norm_adv_clip: 4.0
action_bound_weight: 10.0
action_entropy_weight: 0.0
action_reg_weight: 0.0
disc_buffer_size: 200000
disc_replay_samples: 1000
disc_logit_reg: 0
disc_grad_penalty: 0
disc_eval_batch_size: 0
disc_reward_scale: 2
task_reward_weight: 0.0
disc_reward_weight: 1.0
disc_anchor_calibration: true
disc_anchor_calibration_mode: "rollout"
