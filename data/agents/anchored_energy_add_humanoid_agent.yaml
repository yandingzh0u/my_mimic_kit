agent_name: "ANCHORED_ENERGY_ADD"

model:
  actor_net: "fc_2layers_1024units"
  actor_init_output_scale: 0.01
  actor_std_type: "FIXED"
  action_std: 0.05

  critic_net: "fc_2layers_1024units"

  # The learned objective is a reference-conditioned positive-definite
  # energy.  Its trace and minimum eigenvalue are fixed by construction;
  # these are global geometry choices, not per-feature tracking weights.
  energy_hidden_units: [512, 256]
  energy_rank: 8
  energy_eigen_floor: 0.05
  energy_diagonal_floor: 1e-6
  energy_diagonal_logit_clip: 20.0
  energy_beta_init: 0.0

actor_optimizer:
  type: "SGD"
  learning_rate: 1e-4

critic_optimizer:
  type: "SGD"
  learning_rate: 1e-4

disc_optimizer:
  type: "SGD"
  learning_rate: 2.5e-4
  weight_decay: 0.0001

discount: 0.99
steps_per_iter: 32
iters_per_output: 100
test_episodes: 32
normalizer_samples: 100000000
use_mixed_precision: false

actor_epochs: 5
actor_batch_size: 4
critic_epochs: 2
critic_batch_size: 2
disc_epochs: 2
disc_batch_size: 2

td_lambda: 0.95
ppo_clip_ratio: 0.2
norm_adv_clip: 4.0
action_bound_weight: 10.0
action_entropy_weight: 0.0
action_reg_weight: 0.0

disc_buffer_size: 200000
disc_replay_samples: 1000
disc_logit_reg: 0.0
disc_grad_penalty: 0.0
disc_reward_scale: 1.0
disc_eval_batch_size: 8192

task_reward_weight: 0.0
disc_reward_weight: 1.0
