agent_name: "DARE"

model:
  actor_net: "fc_2layers_1024units"
  actor_init_output_scale: 0.01
  actor_std_type: "FIXED"
  action_std: 0.05
  critic_net: "fc_2layers_1024units"
  disc_net: "fc_2layers_1024units"
  # Isometry-preserving discriminator hidden geometry:
  # semi-orthogonal linears + GroupSort(2) + square 1022x1022 trunk.
  # 'full_sn' reproduces the historical spectral-norm + ReLU backbone.
  disc_group_embedding: true
  disc_hidden_geometry: "semi_orthogonal"

actor_optimizer: {type: "SGD", learning_rate: 1e-4}
critic_optimizer: {type: "SGD", learning_rate: 1e-4}
disc_optimizer: {type: "SGD", learning_rate: 2.5e-4, weight_decay: 0.0001}

discount: 0.99
steps_per_iter: 32
iters_per_output: 100
test_episodes: 32
normalizer_samples: 100000000
use_mixed_precision: false
actor_epochs: 5
actor_batch_size: 4
critic_epochs: 2
critic_batch_size: 2
disc_epochs: 2
disc_batch_size: 2
td_lambda: 0.95
ppo_clip_ratio: 0.2
norm_adv_clip: 4.0
action_bound_weight: 10.0
action_entropy_weight: 0.0
action_reg_weight: 0.0
disc_buffer_size: 200000
disc_replay_samples: 1000
# Inert for DARE: `_disc_logits` is spectral-normalized, so sum(W_eff^2) == 1 is
# a constant whose gradient is exactly zero (DAREAgent._compute_disc_loss).
# Kept at 0 so the config does not advertise a knob that cannot act; AMP/ADD do
# not normalize that layer and keep their (genuine) disc_logit_reg setting.
disc_logit_reg: 0
disc_grad_penalty: 0
disc_eval_batch_size: 0
disc_reward_scale: 2
task_reward_weight: 0.0
disc_reward_weight: 1.0

# --- Calibration switches (both stated explicitly, defaults disagree) --------
# DAREAgent.__init__ defaults:
#   disc_anchor_calibration : True      -> classifier logit affine calibration
#   reward_calibration_mode : "legacy"  -> reward-scale calibration DISABLED
# A config that sets neither therefore runs *half calibrated*: the classifier is
# calibrated while the reward scale is not, and every reward-side calibration
# metric stays constant (Reward_Calibrated=0, Reward_Scale=1) or NaN
# (Reward_Delta_Logit_*, Reward_Probe_Prob).  DAREAgent now prints a warning in
# that state.  Set reward_calibration_mode to "anchor_root" to enable the
# reward-scale calibration; note this CHANGES training semantics, so it must
# match whatever the run is compared against.
# The 2k/3k Climb runs recorded so far used the default, i.e. reward calibration
# OFF, with disc_anchor_calibration = true.
disc_anchor_calibration: true
reward_calibration_mode: "legacy"
