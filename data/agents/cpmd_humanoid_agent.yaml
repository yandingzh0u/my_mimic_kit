agent_name: "CPMD"

# Fixed-budget contextual differential metric.  The policy and value function
# see only the robot observation.  The synchronized reference is used only by
# the reward model to redistribute a fixed metric budget over the normalized
# ADD differential.
model:
  actor_net: "fc_2layers_1024units"
  actor_init_output_scale: 0.01
  actor_std_type: "FIXED"
  action_std: 0.05
  
  critic_net: "fc_2layers_1024units"

  cpmd_schema_version: 2
  metric_rank: 8
  metric_base_weight: 0.01
  metric_context_budget: 1.0
  metric_norm_eps: 1.0e-8
  metric_context_hidden: [256, 128]

actor_optimizer:
    type: "SGD"
    learning_rate: 1e-4
    
critic_optimizer:
    type: "SGD"
    learning_rate: 1e-4

disc_optimizer:
    type: "SGD"
    learning_rate: 2.5e-4
    # Scaling V does not change the trace-normalized metric.  Weight decay
    # would therefore shrink an unidentifiable scale toward the epsilon floor.
    weight_decay: 0.0
    grad_clip: 10.0

discount: 0.99
steps_per_iter: 32
iters_per_output: 100
test_episodes: 32
normalizer_samples: 100000000
use_mixed_precision: false

actor_epochs: 5
actor_batch_size: 4
critic_epochs: 2
critic_batch_size: 2
disc_epochs: 2
disc_batch_size: 2
disc_eval_batch_size: 8192

td_lambda: 0.95
ppo_clip_ratio: 0.2
norm_adv_clip: 4.0
action_bound_weight: 10.0
action_entropy_weight: 0.0
action_reg_weight: 0.0

disc_buffer_size: 200000
disc_replay_samples: 1000
disc_logit_reg: 0.01
# The positive input-gradient is analytically zero for a centered quadratic
# energy.  This coefficient applies to the negative-side logit gradient only.
disc_grad_penalty: 1.0
disc_reward_scale: 2

task_reward_weight: 0.0
disc_reward_weight: 1.0
