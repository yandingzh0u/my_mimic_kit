agent_name: "STADD"

# ZA-STADD: Zero-Anchored Smooth Tchebycheff STADD.
# Identical to st_add_humanoid_agent.yaml except the fusion of the three
# branch logits: instead of the arithmetic mean, the fused logit is
#   z = mean(z(0)) - tau * log[(1/3) sum_i exp((z_i(0) - z_i) / tau)]
# i.e. a smooth bottleneck over the zero-anchored per-branch deficits.
# tau -> inf recovers ST-ADD (mean fusion) exactly; tau -> 0 approaches the
# worst-branch deficit. Gradient weights are softmax(d/tau): the branch
# furthest from its own perfect-tracking anchor automatically dominates the
# reward, with no learned fusion parameters. v1 uses raw (unnormalized)
# deficits by design; per-branch deficit RMS is logged (Disc_D_*) to decide
# whether an EMA-scale-normalized v2 is needed.
model:
  actor_net: "fc_2layers_1024units"
  actor_init_output_scale: 0.01
  actor_std_type: "FIXED"
  action_std: 0.05
  
  critic_net: "fc_2layers_1024units"

  disc_state_net: "fc_2layers_1024units"
  disc_motion_net: "fc_2layers_512units"
  disc_rot_net: "fc_2layers_128units"

  # "mean" = ST-ADD; "za" = zero-anchored smooth-Tchebycheff bottleneck
  disc_fusion: "za"
  disc_fusion_tau: 2.0

actor_optimizer:
    type: "SGD"
    learning_rate: 1e-4
    
critic_optimizer:
    type: "SGD"
    learning_rate: 1e-4

disc_optimizer:
    type: "SGD"
    learning_rate: 2.5e-4
    weight_decay: 0.0001

discount: 0.99
steps_per_iter: 32
iters_per_output: 100
test_episodes: 32
normalizer_samples: 100000000
use_mixed_precision: false

actor_epochs: 5
actor_batch_size: 4
critic_epochs: 2
critic_batch_size: 2
disc_epochs: 2
disc_batch_size: 2

td_lambda: 0.95
ppo_clip_ratio: 0.2
norm_adv_clip: 4.0
action_bound_weight: 10.0
action_entropy_weight: 0.0
action_reg_weight: 0.0

disc_buffer_size: 200000
disc_replay_samples: 1000
disc_logit_reg: 0.01
disc_grad_penalty: 2
disc_reward_scale: 2

disc_aux_branch_weight: 0.5

task_reward_weight: 0.0
disc_reward_weight: 1.0
