agent_name: DARE_REPPO

model:
  actor_net: fc_2layers_1024units
  actor_init_output_scale: 0.01
  actor_std_type: CONSTANT
  action_std: 0.05
  critic_net: fc_2layers_1024units
  disc_net: fc_10layers_1024units
  q_support: [-100.0, 100.0]

actor_optimizer: {type: SGD, learning_rate: 1e-4, grad_clip: 0.5}
critic_optimizer: {type: Adam, learning_rate: 3e-4, grad_clip: 0.5}
disc_optimizer: {type: SGD, learning_rate: 2.5e-4, weight_decay: 0.0001}
dual_optimizer: {type: Adam, learning_rate: 3e-4}
reppo_kl_limit: 0.01
migration_q: output/diagnostics/dare_reppo_physical_20261017/q_seed1061861_raw.pt

discount: 0.99
steps_per_iter: 32
iters_per_output: 100
test_episodes: 32
# Mature-model migration: preserve the archived observation/error coordinates.
normalizer_samples: 0
use_mixed_precision: false
actor_epochs: 5
actor_batch_size: 4
critic_epochs: 2
critic_batch_size: 2
disc_epochs: 2
disc_batch_size: 2
td_lambda: 0.95
ppo_clip_ratio: 0.2
norm_adv_clip: 4.0
action_bound_weight: 10.0
action_entropy_weight: 0.0
action_reg_weight: 0.0
disc_buffer_size: 200000
disc_replay_samples: 1000
disc_reward_scale: 2.0
task_reward_weight: 0.0
disc_reward_weight: 1.0
