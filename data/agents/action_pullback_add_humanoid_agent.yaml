agent_name: "ACTION_PULLBACK_ADD"

model:
  actor_net: "fc_2layers_1024units"
  actor_init_output_scale: 0.01
  actor_std_type: "FIXED"
  action_std: 0.05
  critic_net: "fc_2layers_1024units"
  disc_net: "fc_2layers_1024units"
  response_hidden_units: [512, 512]

actor_optimizer:
  type: "SGD"
  learning_rate: 1e-4
critic_optimizer:
  type: "SGD"
  learning_rate: 1e-4
disc_optimizer:
  type: "SGD"
  learning_rate: 2.5e-4
  weight_decay: 0.0001
response_optimizer:
  type: "Adam"
  learning_rate: 3e-4
  weight_decay: 0.00001
  grad_clip: 1.0

discount: 0.99
steps_per_iter: 32
iters_per_output: 100
test_episodes: 32
normalizer_samples: 100000000
use_mixed_precision: false

actor_epochs: 5
actor_batch_size: 4
critic_epochs: 2
critic_batch_size: 2
disc_epochs: 2
disc_batch_size: 2
response_epochs: 2
response_batch_size: 4
response_validation_size: 4096

td_lambda: 0.95
ppo_clip_ratio: 0.2
norm_adv_clip: 4.0
action_bound_weight: 10.0
action_entropy_weight: 0.0
action_reg_weight: 0.0

disc_buffer_size: 200000
disc_replay_samples: 1000
disc_logit_reg: 0.01
disc_grad_penalty: 2
disc_reward_scale: 2

task_reward_weight: 0.0
disc_reward_weight: 1.0

# The pullback is a local first-order direction in normalized action space.
# Its per-sample direction is unit normalized. The linear surrogate is
# truncated on a box around the cached action mean; this only limits the local
# auxiliary support and is not a constraint on the executed action or policy.
pullback_weight: 1.0
pullback_grad_clip: 1.0
pullback_normalize_direction: true
pullback_min_grad_norm: 0.000001
pullback_action_delta_clip: 0.05
pullback_eval_batch_size: 4096
pullback_audit_batch_size: 2048
